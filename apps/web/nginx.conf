# SPA + reverse proxy di /api verso il container api.
# "api" viene risolto dal DNS interno di Docker a ogni richiesta, così nginx parte
# anche se l'api si riavvia o cambia indirizzo.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 12m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    # Server-Sent Events (avanzamento generazione CV): niente buffering
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # i moduli ES (.mjs, es. il worker di pdf.js) vanno serviti come JavaScript
  location ~* \.mjs$ {
    types {
      application/javascript mjs;
    }
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
